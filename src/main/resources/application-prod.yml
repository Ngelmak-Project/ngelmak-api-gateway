spring:
  application:
    name: "Ngelmak Project - Gateway"
  config:
    import: vault:// # Enable Vault as a Config Data source
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "https://ngelmak.org" # frontend app
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
    vault:
      uri: http://vault:8200
      authentication: approle
      fail-fast: true # Enable fail-fast to force confirmation. Spring Boot to crash immediately when Vault/OpenBao is not reachable
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
      database:
        enabled: false
      kv:
        enabled: true
        backend: secret
        application-name: jjwt
        default-context: ""  # or omit this entirely
server:
  port: 37173
debug: false
logging:
  level:
    root: INFO