spring:
  application:
    name: "Ngelmak Project - Gateway"
  profiles:
    active: dev
  config:
    import: optional:vault:// # Enable Vault as a Config Data source. This requires at least one Vault backend to be enabled and resolvable.
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"        # allow any origin during development
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
    vault:
      uri: http://vault:8200
      authentication: approle
      fail-fast: false # Enable fail-fast to force confirmation. Spring Boot to crash immediately when Vault/OpenBao is not reachable
      app-role:
        role-id: ""
        secret-id: ""
      database:
        enabled: false
      kv:
        enabled: false

server:
  port: 4000

spring.devtools.livereload.port: 35730

logging:
  level:
    level:
      web: ERROR
    org.springframework.vault: DEBUG
    org.springframework.boot.autoconfigure: INFO

debug: true

